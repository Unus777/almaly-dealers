<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявки дилеров — Алмалы-Керамик</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230c0e10'/><path d='M50 20 66 50 50 80 34 50z' fill='%23c9a227'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .orders{display:flex;flex-direction:column;gap:14px;padding-bottom:60px}
  .order{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .order.new{border-color:var(--accent)}
  .order .hd{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  .order .hd b{font-size:18px}
  .order .hd .when{color:var(--dim);font-size:13px}
  .order .hd .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .status{border-radius:999px;padding:4px 12px;font-size:12.5px;border:1px solid var(--line2);color:var(--dim)}
  .status.s-new{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .status.s-work{border-color:#4d7ea8;color:#8fbede}
  .status.s-done{border-color:#3f7a52;color:var(--ok)}
  .status.s-cancel{border-color:#7a4141;color:#e0a1a1}
  .order .lines{margin-top:12px;color:var(--dim);font-size:14px}
  .order .lines table{width:100%;border-collapse:collapse}
  .order .lines td{padding:6px 10px 6px 0;border-top:1px solid var(--line);font-size:13.5px}
  .order .lines td:first-child{color:var(--tx)}
  .order .who{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13.5px;margin-top:6px}
  .order .who b{color:var(--tx);font-weight:500}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0}
  .filters .count{margin-left:auto}
  .incoming{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);
    padding:18px 20px;margin:20px 0}
</style>

<header><div class="wrap head">
  <a class="logo" href="index.html">Алмалы<span>·</span>Керамик</a>
  <span class="sub">Заявки дилеров</span>
  <span class="right"><a class="navlink" href="index.html">Каталог</a></span>
</div></header>

<main class="wrap">
  <h1 style="font-size:32px;margin:24px 0 2px">Заявки дилеров</h1>
  <p class="note">Журнал заявок этого устройства. Заявка попадает сюда, когда вы открываете ссылку
     из письма или WhatsApp — нажмите «Принять в журнал», и она сохранится со статусом.</p>

  <div id="incoming"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="Поиск: заказчик, телефон, артикул" aria-label="Поиск">
    <div class="chips" id="st" role="group">
      <button class="chip" aria-pressed="true" data-v="">Все</button>
      <button class="chip" data-v="new">Новые</button>
      <button class="chip" data-v="work">В работе</button>
      <button class="chip" data-v="done">Отгружены</button>
      <button class="chip" data-v="cancel">Отменены</button>
    </div>
    <button class="btn" id="csv">Выгрузить CSV</button>
    <span class="count" id="count"></span>
  </div>

  <div class="orders" id="orders"></div>
  <div id="sheet"></div>
</main>

<footer><div class="wrap foot"><span>ООО «Алмалы-Керамик» · оптовый отдел</span></div></footer>
<div id="toast"></div>
<script src="config.js"></script>
<script src="manager.js"></script>
