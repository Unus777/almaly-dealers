<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бланк заказа — Алмалы-Керамик</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230c0e10'/><path d='M50 20 66 50 50 80 34 50z' fill='%23c9a227'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<header><div class="wrap head">
  <a class="logo" href="index.html">Алмалы<span>·</span>Керамик</a>
  <span class="sub">Бланк заказа</span>
  <span class="right">
    <a class="navlink" href="index.html">← Продолжить выбор</a>
  </span>
</div></header>

<main class="wrap">
  <h1 style="font-size:34px;margin:26px 0 4px">Бланк заказа</h1>
  <p class="note" style="margin-bottom:22px">Заполните данные, проверьте позиции и распечатайте бланк
    или сохраните его в PDF. Готовый бланк можно сразу отправить менеджеру в WhatsApp или почтой.</p>

  <div class="block">
    <h2>Позиции заказа</h2>
    <div id="items"></div>
  </div>

  <div class="block">
    <h2>Заказчик</h2>
    <div class="form-grid">
      <div class="field"><label>Наименование заказчика <span class="req">*</span></label>
        <input id="f-customer" placeholder="ООО «Название» / ИП Фамилия" required></div>
      <div class="field"><label>Контактное лицо <span class="req">*</span></label>
        <input id="f-person" placeholder="Имя"></div>
      <div class="field"><label>Телефон <span class="req">*</span></label>
        <input id="f-phone" type="tel" placeholder="+7 ___ ___-__-__"></div>
      <div class="field"><label>Город / адрес</label><input id="f-city" placeholder="Москва"></div>
      <div class="field"><label>Дата заказа</label><input id="f-date" type="date"></div>
      <div class="field"><label>Желаемая дата отгрузки</label><input id="f-ship" type="date"></div>
    </div>
  </div>

  <div class="block">
    <h2>Доставка и оплата</h2>
    <div class="form-grid">
      <div class="field"><label>Способ доставки</label>
        <select id="f-delivery">
          <option>Самовывоз со склада</option>
          <option>Доставка транспортом поставщика</option>
          <option>Транспортная компания</option>
        </select></div>
      <div class="field"><label>Транспортная компания / адрес доставки</label>
        <input id="f-address" placeholder="Название ТК или адрес"></div>
      <div class="field"><label>Способ оплаты</label>
        <select id="f-payment">
          <option>Безналичный расчёт с НДС</option>
          <option>Безналичный расчёт без НДС</option>
          <option>Перевод на карту</option>
          <option>Наличные при получении</option>
        </select></div>
      <div class="field"><label>Комментарий к заказу</label>
        <input id="f-note" placeholder="Например: нужен паллетный борт"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="print">Печать / сохранить PDF</button>
    <button class="btn" id="wa">Отправить в WhatsApp</button>
    <button class="btn" id="mail">Отправить почтой</button>
    <button class="btn" id="copy">Скопировать текст заявки</button>
    <button class="btn" id="clear">Очистить заказ</button>
  </div>

  <div id="sheet"></div>
</main>

<footer><div class="wrap foot"><span>ООО «Алмалы-Керамик» · оптовый отдел</span></div></footer>
<div id="toast"></div>
<script src="config.js"></script>
